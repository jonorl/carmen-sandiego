name: CI

# Checks pushes to main and pull requests, so a change can be seen to pass
# before it's merged.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The game's code on the computer, through tools/emulator: formatting, lints
  # and the rules' tests (which can't run on the device).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The repository's toolchain is the ESP32's; the emulator's is stable.
      - name: Set up Rust
        run: rustup toolchain install stable --component rustfmt,clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/emulator

      - name: Format
        run: rustfmt +stable --edition 2024 --check $(git ls-files '*.rs')

      - name: Lint
        working-directory: tools/emulator
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Test
        working-directory: tools/emulator
        run: cargo test --release

  # The firmware itself, for the ESP32-S3: lints for the code only the device
  # builds (main.rs, the display, touch, WiFi, sound, flash and the checks in
  # src/bin), then a build. Without cfg.toml it has no network settings,
  # which is enough to know it compiles and links.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the esp toolchain
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: esp32s3
          ldproxy: true

      # ESP-IDF is a large download, made by the first build.
      - name: Cache ESP-IDF
        uses: actions/cache@v6
        with:
          path: ~/.espressif
          key: esp-idf-${{ runner.os }}-${{ hashFiles('.cargo/config.toml', 'sdkconfig.defaults') }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # The esp toolchain's clippy asks for a const initialiser that lang.rs already has.
      - name: Lint
        run: cargo clippy --release --bins --lib -- -D warnings -A clippy::missing_const_for_thread_local

      - name: Build
        run: cargo build --release
