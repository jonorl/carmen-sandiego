name: CI

# The deploy workflows only run on main; this one also checks pull requests,
# so a change can be seen to pass before it's merged.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # For the server's tests (sqlx::test makes a database per test).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # rustup is on GitHub's runners; with no arguments it installs what rust-toolchain.toml names.
      - name: Set up Rust
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # The desktop build links against these.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Check the data files
        run: cargo run -- --check
