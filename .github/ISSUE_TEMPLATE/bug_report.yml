name: Bug report
description: Something in the game, the records server or the ESP32 version doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: On desktops, `--seed N --rank R` replays a case exactly; include them if you can.
      placeholder: |
        1. Start a case as a Rookie
        2. Fly to ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Browser on a computer
        - Browser on a phone or tablet
        - Desktop (Linux)
        - Desktop (Windows)
        - Desktop (macOS)
        - ESP32-S3
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Browser, OS or release
      description: For the ESP32, the release or commit, and the board, screen and power supply (resets and crashes are often power).
  - type: textarea
    id: log
    attributes:
      label: Serial monitor output (ESP32)
      description: What `cargo run --release` (or `espflash monitor`) printed around the problem, if you have it.
      render: text
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [English, Spanish]
