name: Idea
description: A new country, feature, board or screen, or a change to the game.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would add for players. If it changes the original's rules, say how.
