name: Build and Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'game/server/**'
      - 'game/shared/**'
      - 'game/Cargo.lock'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: game

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # For the server's tests (sqlx::test makes a database per test).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # rustup is on GitHub's runners; with no arguments it installs what rust-toolchain.toml names.
      - name: Set up Rust
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: game

      - name: Test
        run: cargo test -p carmen-shared -p carmen-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # The whole of game/ is the context: the server shares a crate with the game.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: game
          file: game/server/Dockerfile
          push: true
          tags: ghcr.io/jonorl/carmen-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker compose -f ~/my-VPS/projects/docker-compose.yml pull carmen-api
            docker compose -f ~/my-VPS/projects/docker-compose.yml up -d carmen-api

      # The new container runs the migrations as it starts; fail the run if it never answers.
      - name: Check the server is up
        run: |
          for i in $(seq 1 12); do
            curl -fsS https://carmen-api.jonathan-orlowski.dev/health && exit 0
            sleep 5
          done
          exit 1
